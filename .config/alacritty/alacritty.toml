[env]
TERM = "xterm-256color"

[terminal.shell]
program = "/bin/zsh"

# bold/italic variants inherit the normal family
[font]
size = 11.0
normal = { family = "Source Code Pro" }
offset = { x = 0, y = 1 }

[window]
padding = { x = 1, y = 1 }
dynamic_padding = true
opacity = 0.95
decorations = "Buttonless"

# scroll with plain PageUp/PageDown (default needs Shift); other bindings are defaults
[[keyboard.bindings]]
action = "ScrollPageUp"
key = "PageUp"
mode = "~Alt"
mods = "None"

[[keyboard.bindings]]
action = "ScrollPageDown"
key = "PageDown"
mode = "~Alt"
mods = "None"
